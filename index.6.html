/div><div class="treeNode"><strong>④ 约束瓶颈</strong><br>限制增长的可能不是流量，而是现金、库存、产能或交付。</div></div><div class="sourceNote">结构借鉴案例式教学与应用公司金融：先给场景、数据和约束，再做决定并看后果。</div></div></div>`}
function runBizDay(){const p=+price.value,adSpend=+ad.value,replen=+stock.value,base=170,elasticity=Math.max(.35,1-(p-119)/160),adBoost=1+Math.sqrt(adSpend/3000)*.28,demand=Math.round(base*elasticity*adBoost*(.9+Math.random()*.2)),unitCost=48,available=S.bizInventory+replen,sold=Math.min(demand,available),revenue=sold*p,cogs=sold*unitCost,buyCost=replen*unitCost,contrib=revenue-cogs-adSpend;S.bizCash+=revenue-adSpend-buyCost;S.bizInventory=available-sold;save();const cac=sold?adSpend/sold:0,margin=sold?(p-unitCost-cac):0;bizCash.textContent='¥'+Math.round(S.bizCash).toLocaleString();bizInv.textContent=S.bizInventory+'份';bizResult.innerHTML='<div class="callout"><b>今日结算</b><br>需求 '+demand+'｜成交 '+sold+'｜收入 ¥'+Math.round(revenue).toLocaleString()+'｜贡献利润 ¥'+Math.round(contrib).toLocaleString()+'<br>CAC≈¥'+cac.toFixed(1)+'｜单客贡献≈¥'+margin.toFixed(1)+'<br><br><b>军师点评：</b>'+((S.bizCash<25000)?'增长太快，现金危险。先保补给线。':(S.bizInventory>250?'库存占用偏高，备货超过销售消化能力。':'现金与库存可控，可以继续测试价格弹性。'))+'</div>';complete('biz_0');complete('biz_1')}
function renderFinance(){top('金融云海 · 资金传导殿','市场结构 · 利率 · 信用 · 久期');getScreenBody().innerHTML=`<div class="sceneHero"><div class="sceneBg" style="background:radial-gradient(circle at 50% 20%,#4b8da9,#173e55 35%,#08182c 75%)"></div><div class="sceneTitle"><small>宏观传导模拟</small><h1>你掌管一座仙银库</h1><p>调利率、信用利差和久期，亲手看融资成本与债券价格如何变化。</p></div></div><div class="content">${lessonsHtml([['货币与信用','钱如何被创造'],['利率传导','政策如何到企业'],['久期','利率与债券价格'],['流动性','为何会突然断裂']],'fin_')}<div class="card"><h3>资金传导盘</h3><div class="flowMap"><div class="flowNode fn1">央行</div><div class="flowNode fn2">银行</div><div class="flowNode fn3">企业</div><div class="flowNode fn4">资产市场</div><div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div></div><div class="sliderRow"><label><span>政策利率</span><b><span id="rateV">3.0</span>%</b></label><input id="rate" type="range" min="1" max="6" step=".25" value="3" oninput="financeCalc()"></div><div class="sliderRow"><label><span>信用利差</span><b><span id="spreadV">2.0</span>%</b></label><input id="spread" type="range" min=".5" max="6" step=".25" value="2" oninput="financeCalc()"></div><div class="sliderRow"><label><span>债券久期</span><b><span id="durV">6</span>年</b></label><input id="dur" type="range" min="1" max="12" value="6" oninput="financeCalc()"></div><div id="finResult" class="callout"></div></div><div class="card"><h3>真正的判断链</h3><p>政策利率 → 银行风险偏好 → 信用利差 → 企业实际融资成本 → 折现率 → 资产价格。任何一环卡住，降息都未必直接变成“资产上涨”。</p></div></div>`;financeCalc()}
function financeCalc(){const r=+rate.value,s=+spread.value,d=+dur.value;rateV.textContent=r.toFixed(2);spreadV.textContent=s.toFixed(2);durV.textContent=d;const loan=r+s+1.2,bond=-d*.5;finResult.innerHTML='<b>传导结果</b><br>企业贷款成本≈'+loan.toFixed(2)+'%<br>若利率再升0.5%，久期'+d+'年的债券价格近似变化 '+bond.toFixed(1)+'%<br><br><b>关键：</b>久期越长，对利率越敏感；信用利差扩大时，政策降息也可能传不到企业。';complete('fin_1')}
let prices=[92,94,93,96,98,101,99,103,105,102,106,108,104,100];function renderStocks(){top('股票星台 · 虚拟交易终端','虚拟公司 · 仓位 · 估值 · 预期差');getScreenBody().innerHTML=`<div class="sceneHero"><div class="sceneBg" style="background:radial-gradient(circle at 50% 15%,#4c3276,#131c45 48%,#081225)"></div><div class="sceneTitle"><small>模拟交易，不涉及真实证券</small><h1>云舟科技 · 估值与仓位战</h1><p>先看公司，再看价格，再决定仓位。仓位不是“信心条”，而是风险预算。</p></div></div><div class="content">${lessonsHtml([['看生意','公司怎么赚钱'],['看预期','市场押了什么'],['看估值','价格隐含什么未来'],['看仓位','错了还能活多久']],'stk_')}<div class="card"><div class="grid2"><div class="metric"><small>现价</small><b id="stkPrice">¥${S.stockPrice.toFixed(2)}</b><em id="priceChg">0.0%</em></div><div class="metric"><small>虚拟现金</small><b id="stkCash">¥${Math.round(S.stockCash).toLocaleString()}</b><em>模拟账户</em></div><div class="metric"><small>持仓</small><b id="stkShares">${S.stockShares}股</b><em id="posPct">0%</em></div><div class="metric"><small>市场预期增长</small><b>38%</b><em>当前剧本</em></div></div><div class="chart"><canvas id="chart"></canvas></div><div class="orderbook"><div class="book"><b>公司基本面</b>营收增速26%<br>毛利率51%<br>FCF利润率12%</div><div class="book"><b>市场给的剧本</b>未来3年增速38%<br>估值62x<br>情绪：偏热</div></div><div class="sliderRow"><label><span>目标仓位</span><b><span id="posV">20</span>%</b></label><input id="pos" type="range" min="0" max="60" value="20" step="5" oninput="posV.textContent=this.value"></div><div class="btnRow"><button class="btn gold" onclick="tradeStock()">调仓</button><button class="btn" onclick="stockNews('beat')">业绩超预期</button><button class="btn" onclick="stockNews('miss')">业绩不及预期</button></div><div id="stockTeach"></div></div><div class="card"><h3>估值训练</h3><p>把估值当成“反推市场在假设什么”。价格越高，未来需要兑现的增长越高。好公司和好投资是两件事，还要看安全边际与仓位。</p></div></div>`;drawChart();updatePos()}
function drawChart(){const c=document.getElementById('chart');if(!c)return;const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.scale(d,d);x.clearRect(0,0,w,h);x.strokeStyle='rgba(255,255,255,.08)';for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,h*i/5);x.lineTo(w,h*i/5);x.stroke()}const min=Math.min(...prices)-4,max=Math.max(...prices)+4;x.beginPath();prices.forEach((p,i)=>{const px=i/(prices.length-1)*w,py=h-(p-min)/(max-min)*h;if(i===0)x.moveTo(px,py);else x.lineTo(px,py)});x.strokeStyle='#7fe7ff';x.lineWidth=2;x.shadowBlur=10;x.shadowColor='#72dbff';x.stroke()}function updatePos(){const val=S.stockCash+S.stockShares*S.stockPrice,pct=val?S.stockShares*S.stockPrice/val*100:0;if(document.getElementById('posPct'))posPct.textContent=pct.toFixed(1)+'%'}function tradeStock(){const target=+pos.value/100,total=S.stockCash+S.stockShares*S.stockPrice,targetShares=Math.floor(total*target/S.stockPrice),diff=targetShares-S.stockShares;S.stockCash-=diff*S.stockPrice;S.stockShares=targetShares;save();stkCash.textContent='¥'+Math.round(S.stockCash).toLocaleString();stkShares.textContent=S.stockShares+'股';updatePos();stockTeach.innerHTML='<div class="callout"><b>仓位训练</b><br>仓位不是信心大小，而是最大损失预算。即使有优势，也要考虑估值、波动与相关性。</div>';complete('stk_3')}function stockNews(type){const old=S.stockPrice,shock=type==='beat'?(5+Math.random()*5):-(7+Math.random()*7);S.stockPrice=Math.max(20,S.stockPrice*(1+shock/100));prices.push(S.stockPrice);if(prices.length>18)prices.shift();save();stkPrice.textContent='¥'+S.stockPrice.toFixed(2);priceChg.textContent=((S.stockPrice/old-1)*100).toFixed(1)+'%';drawChart();updatePos();stockTeach.innerHTML='<div class="callout"><b>预期差</b><br>'+(type==='beat'?'超预期不代表一定值得追。先问这个惊喜是否已经被高估值提前写进价格。':'公司仍可能增长，但低于市场原先剧本。股价变化是“实际相对预期”的重估。')+'</div>';complete('stk_1')}
function renderMind(){top('思维天门 · 决策推演阵','二阶思维 · 概率 · 逆向 · 系统');getScreenBody().innerHTML=`<div class="sceneHero"><div class="sceneBg" style="background:radial-gradient(circle at 50% 25%,#5b397e,#182548 48%,#081325)"></div><div class="sceneTitle"><small>不是答题，是推演</small><h1>一次正确，为什么可能导致长期失败？</h1><p>信息一层层揭示，你必须更新判断。训练的是模型更新，不是坚持第一次答案。</p></div></div><div class="content">${lessonsHtml([['二阶效应','然后呢？'],['概率更新','新信息来了怎么办'],['逆向排雷','先避免致命错误'],['激励系统','奖励什么得到什么']],'mind_')}<div class="card"><h3>决策树 · 销售奖金改革</h3><div class="tree"><div class="treeNode"><strong>第一层：</strong>奖金提高后，当月销售额+35%。</div><div class="treeNode"><strong>第二层：</strong>退款率从6%升到14%。</div><div class="treeNode"><strong>第三层：</strong>销售话术开始夸大承诺，复购率下降。</div></div><div class="btnRow"><button class="btn" onclick="mindChoice(0)">继续加奖金</button><button class="btn gold" onclick="mindChoice(1)">重设激励指标</button><button class="btn" onclick="mindChoice(2)">责怪员工</button></div><div id="mindTeach"></div></div><div class="card"><h3>高手思维顺序</h3><p>先定义目标函数，再看激励会把系统推向哪里；看第一阶结果后继续问“然后呢”；最后做反事实：关键变量反过来时，答案是否也该改变？</p></div></div>`}function mindChoice(i){mindTeach.innerHTML='<div class="callout"><b>'+(i===1?'破阵':'再看一层')+'</b><br>'+(i===1?'问题不在奖金本身，而在系统只优化“成交额”。目标应同时约束净收入、退款、复购和客户质量。':'你仍然只看个人或第一阶结果。核心变量是激励机制如何改变行为，再改变系统。')+'</div>';if(i===1)complete('mind_0')}
function renderMasters(){top('高手仙阁 · 四位军师','公开思想 · 可复用判断顺序');const m=[['巴菲特式','先看生意质量，再看价格：护城河、资本回报、管理层、安全边际。'],['芒格式','反过来想：先列出让你永久出局的错误，再逐个排掉。'],['贝索斯式','找长期不变需求：围绕用户长期都想要的东西持续投资。'],['格鲁夫式','识别战略转折点：底层竞争规则变了，旧优势可能变成包袱。']];getScreenBody().innerHTML=`<div class="sceneHero"><div class="sceneBg" style="background:radial-gradient(circle at 50% 25%,#354d55,#172d35 50%,#081325)"></div><div class="sceneTitle"><small>不背名言</small><h1>高手不是神谕，是判断顺序</h1><p>每位军师只留下一个你以后能重复使用的框架。</p></div></div><div class="content"><div class="card"><h3>四位军师</h3><div class="tree">${m.map(x=>'<div class="treeNode"><strong>'+x[0]+'</strong><br>'+x[1]+'</div>').join('')}</div></div><div class="card"><h3>合议庭 · 对手降价30%</h3><p>你的复购率高，对手现金充足，新客增长变慢。不能只问“跟不跟价”。</p><div class="btnRow"><button class="btn" onclick="masterCase(0)">全面跟价</button><button class="btn" onclick="masterCase(1)">完全不动</button><button class="btn gold" onclick="masterCase(2)">拆分战场</button></div><div id="masterTeach"></div></div><div class="sourceNote">只使用公开、广为人知的决策思想做教学抽象，不复制任何收费课程或专有教材。</div></div>`}function masterCase(i){masterTeach.innerHTML='<div class="callout"><b>'+(i===2?'军师合议通过':'军师驳回')+'</b><br>'+(i===2?'护城河看防守，逆向思维看致命风险，长期需求看用户价值，战略转折点看竞争规则。答案不是“永远不降价”，而是按用户、渠道、产品拆分战场。':'单一动作太粗。高手会先拆问题，再选择战场。')+'</div>';if(i===2)complete('master_0')}
function renderGrowth(){top('成长神树 · 资源配置局','机会成本 · 复利 · 能力资产');getScreenBody().innerHTML=`<div class="sceneHero"><div class="sceneBg" style="background:radial-gradient(circle at 50% 25%,#3d704b,#173d31 48%,#081325)"></div><div class="sceneTitle"><small>把自己当一家公司经营</small><h1>你只有100点精力，怎么配置？</h1><p>人生不是“都努力一点”，而是在有限资源下，把时间投给回报最高、还能复利的能力。</p></div></div><div class="content"><div class="card"><h3>资源配置</h3><div class="sliderRow"><label><span>赚钱技能</span><b><span id="g1v">40</span></b></label><input id="g1" type="range" min="0" max="100" value="40" oninput="growthSync()"></div><div class="sliderRow"><label><span>内容资产</span><b><span id="g2v">30</span></b></label><input id="g2" type="range" min="0" max="100" value="30" oninput="growthSync()"></div><div class="sliderRow"><label><span>健康与精力</span><b><span id="g3v">30</span></b></label><input id="g3" type="range" min="0" max="100" value="30" oninput="growthSync()"></div><div id="growthTeach" class="callout"></div></div><div class="card"><h3>复利判断</h3><p>每一小时都问：做完以后，明天还剩下什么？如果留下模板、作品、用户关系、技能、品牌或系统，它才可能复利。</p></div></div>`;growthSync()}function growthSync(){let a=+g1.value,b=+g2.value,c=+g3.value,sum=a+b+c;if(sum>100){c=Math.max(0,c-(sum-100));g3.value=c}g1v.textContent=g1.value;g2v.textContent=g2.value;g3v.textContent=g3.value;growthTeach.innerHTML='<b>总配置 '+(+g1.value+ +g2.value+ +g3.value)+'/100</b><br>高手不追求平均努力，而是在保证生存后，把更多资源投向最高边际回报和可复利能力。';complete('growth_0')}
function renderWealth(){top('财富神域 · 百万主线','工资 → 价值交换 → 系统收入 → 资产');getScreenBody().innerHTML=`<div class="sceneHero"><div class="sceneBg" style="background:radial-gradient(circle at 50% 15%,#8a622a,#3b2b1d 45%,#081325)"></div><div class="sceneTitle"><small>终极主线</small><h1>100万不是愿望，是一组可计算变量</h1><p>把目标拆成产品、客单价、成交量、利润率、复购和杠杆。</p></div></div><div class="content">${lessonsHtml([['第一境','工资的本质'],['第二境','第一笔非工资收入'],['第三境','可重复收入'],['第四境','杠杆与系统'],['第五境','资产与复利'],['终局','100万数学']],'wealth_')}<div class="card"><h3>百万路径计算器</h3><div class="sliderRow"><label><span>客单价</span><b>¥<span id="wPriceV">2000</span></b></label><input id="wPrice" type="range" min="99" max="20000" step="100" value="2000" oninput="wealthCalc()"></div><div class="sliderRow"><label><span>每月成交人数</span><b><span id="wClientsV">20</span>人</b></label><input id="wClients" type="range" min="1" max="200" value="20" oninput="wealthCalc()"></div><div class="sliderRow"><label><span>净利润率</span><b><span id="wMarginV">50</span>%</b></label><input id="wMargin" type="range" min="10" max="90" value="50" oninput="wealthCalc()"></div><div id="wealthResult" class="callout"></div></div><div class="card"><h3>五次升级</h3><div class="wealthGrid"><div class="wealthStage"><b>1. 卖时间</b><span>工资：稳定，但高度绑定工时和组织。</span></div><div class="wealthStage"><b>2. 卖结果</b><span>客户直接为你解决的问题付钱。</span></div><div class="wealthStage"><b>3. 卖系统</b><span>把重复问题做成标准产品、训练营、模板。</span></div><div class="wealthStage"><b>4. 用杠杆</b><span>内容、代码、团队、资本，让同一能力服务更多人。</span></div><div class="wealthStage"><b>5. 持有资产</b><span>把利润变成未来现金流资产。</span></div><div class="wealthStage"><b>终局：自由度</b><span>目标是更多时间和选择权。</span></div></div></div><div class="card"><h3>你的现实起点</h3><p>先做一个最小可交易产品：例如“短视频选题+AI文案+账号复盘”的小服务/资料包 → 获得第一批付费 → 找到高频问题 → 标准化 → 提升客单或做训练营 → 用内容获客 → 把交付沉淀成资产。</p><div class="sourceNote">这是商业训练，不保证收益；100万路线要根据真实客单、转化、成本、时间和税费持续修正。</div></div></div>`;wealthCalc()}function wealthCalc(){const p=+wPrice.value,c=+wClients.value,m=+wMargin.value/100;wPriceV.textContent=p;wClientsV.textContent=c;wMarginV.textContent=Math.round(m*100);const annual=p*c*12,profit=annual*m,clients=Math.ceil(1000000/(p*m)),months=profit>0?1000000/(p*c*m):999;wealthResult.innerHTML='<b>当前模型</b><br>年营收≈¥'+Math.round(annual).toLocaleString()+'｜年净利润≈¥'+Math.round(profit).toLocaleString()+'<br>累计100万净利润约需 '+months.toFixed(1)+'个月，或累计约 '+clients+' 个付费客户。<br><br><b>下一步：</b>不要只问“怎么赚100万”，先看最值得提升的是客单、成交、利润率、复购还是交付杠杆。';complete('wealth_5')}
</script></body></html>
